name: Deploy production aliases

# One-shot: runs only when this file changes on the CityU branch.
# Uses the repo secret VERCEL_TOKEN. Does not store the token in git.
on:
  push:
    branches:
      - cursor/ptero-cityu-match
    paths:
      - .github/workflows/deploy-production.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy servecart and alias the public hosts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "VERCEL_TOKEN is empty. Add it as a GitHub Actions secret."
            exit 1
          fi
          npx --yes vercel@59.3.0 link --yes --team fusion-1468 --project servecart --token "$VERCEL_TOKEN"
          npx --yes vercel@59.3.0 --prod --yes --scope fusion-1468 --token "$VERCEL_TOKEN" | tee /tmp/vercel-deploy.txt
          host=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/vercel-deploy.txt | tail -1 | sed 's#https://##')
          echo "Deployment host: ${host}"
          test -n "${host}"
          for alias in gracerun.fit www.gracerun.fit gracerun.vercel.app servecart.vercel.app; do
            npx --yes vercel@59.3.0 alias set "${host}" "${alias}" --scope fusion-1468 --token "$VERCEL_TOKEN"
          done
          npx --yes vercel@59.3.0 alias ls --scope fusion-1468 --token "$VERCEL_TOKEN"
